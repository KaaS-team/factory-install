name: npm-publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released factory tag to publish, for example v6.2.0
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download the release assets
        run: gh release download "$TAG" -R KaaS-team/KaaS-factory -p 'factory-*' -p SHA256SUMS -D dist/assets
      - name: Pack
        run: node scripts/npm-pack.mjs --assets dist/assets --out dist/npm --version "$TAG"
      - name: Publish
        run: sh scripts/npm-publish.sh dist/npm --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
