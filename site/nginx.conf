server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = / {
    default_type text/plain;
    try_files /install.sh =404;
  }

  location = /install.sh {
    default_type text/plain;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
